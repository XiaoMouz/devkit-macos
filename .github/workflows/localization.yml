name: Check translations

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'DevKit/**'
      - 'Vendor/*.mjs'
      - 'Scripts/localization*.py'
      - '.github/workflows/localization.yml'
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'DevKit/**'
      - 'Vendor/*.mjs'
      - 'Scripts/localization*.py'
      - '.github/workflows/localization.yml'

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 Scripts/localization.py --check
