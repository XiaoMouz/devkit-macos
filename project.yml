name: DevKit
options:
  developmentLanguage: en
  bundleIdPrefix: app.devkit
  deploymentTarget:
    macOS: '26.0'
  xcodeVersion: '27.0'
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  DevKitCore:
    path: .
targets:
  DevKitCLI:
    type: tool
    platform: macOS
    sources: [Sources/DevKitCLI]
    dependencies:
      - package: DevKitCore
        product: DevKitCore
    settings:
      base:
        PRODUCT_NAME: devkit
        PRODUCT_BUNDLE_IDENTIFIER: app.devkit.cli
        SKIP_INSTALL: YES
  DevKitWorker:
    type: tool
    platform: macOS
    sources: [Sources/DevKitWorker]
    dependencies:
      - package: DevKitCore
        product: DevKitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.devkit.worker
        SKIP_INSTALL: YES
  DevKit:
    type: application
    platform: macOS
    sources: [DevKit]
    dependencies:
      - package: DevKitCore
        product: DevKitCore
      - target: DevKitWorker
        embed: false
      - target: DevKitCLI
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.devkit.macos
        PRODUCT_NAME: DevKit
        INFOPLIST_FILE: DevKit/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO
    postBuildScripts:
      - name: Embed command-line helpers
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/DevKitWorker" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/DevKitWorker"
          cp "$BUILT_PRODUCTS_DIR/devkit" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/devkit"
        basedOnDependencyAnalysis: false
schemes:
  DevKit:
    build:
      targets:
        DevKit: all
    run:
      config: Debug
    archive:
      config: Release
